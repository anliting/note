services:
  app:
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    image: note-app
    init: true
    volumes:
      - ./bin:/app/bin
  db:
    environment:
      POSTGRES_PASSWORD:
    healthcheck:
      test: [CMD-SHELL,'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    image: postgres:18.0
    volumes:
      - db:/var/lib/postgresql
